name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/check-hygiene.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
      - uses: actions/cache@v5
        with:
          path: .lake
          key: build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - run: lake build
      - name: Rule table is in sync with the pinned Logos signature
        run: python3 scripts/gen-rules.py --check
      - name: Example scripts give the expected output
        run: |
          for f in test/examples/*.smt2; do
            .lake/build/bin/telos "$f" | diff - "${f%.smt2}.expected"
          done
      - name: Preprocessing gives the expected output, with proofs that Logos accepts
        run: |
          for f in test/preprocess/*.smt2; do
            .lake/build/bin/telos --post-asserts "$f" | diff - "${f%.smt2}.expected"
            .lake/build/bin/telos --post-asserts --proof-dir "$RUNNER_TEMP/proof" --check-proof "$f" \
              | diff - "${f%.smt2}.expected"
          done


  # telos's proofs, against the Logos theorems they use as a hypothesis
  # (`LogosFacts`), so that none of Logos's proofs are built.
  # `lake build TelosFull` in `verification/` discharges it with Logos's theorem.
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
      - uses: actions/cache@v5
        with:
          path: |
            .lake
            verification/.lake
          key: verification-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'verification/lakefile.toml', 'verification/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: verification-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'verification/lakefile.toml', 'verification/lake-manifest.json') }}-
      - name: Fetch Mathlib's prebuilt cache
        working-directory: verification
        run: lake exe cache get
      - name: Build the proofs and audit their axioms
        working-directory: verification
        run: lake build
