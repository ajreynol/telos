name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/check-hygiene.sh

  solver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
      - uses: actions/cache@v5
        with:
          path: .lake
          key: solver-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: solver-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - run: lake build
      - name: Rule table is in sync with the pinned Logos signature
        run: python3 scripts/gen-rules.py --check
      - name: Example scripts give the expected output
        run: |
          for f in test/examples/*.smt2; do
            .lake/build/bin/telos "$f" | diff - "${f%.smt2}.expected"
          done

