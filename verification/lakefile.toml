name = "TelosVerification"
version = "0.1.0"
defaultTargets = ["TelosProofs"]
# Mathlib's style linters do not apply to this project (see Logos's
# verification/lakefile.toml, which this mirrors).
weakLeanArgs = [
  "-Dweak.linter.mathlibStandardSet=false",
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.0"

# Logos's verification package: model semantics and checker soundness proofs.
# Same commit as the `Cpc` requirement in ../lakefile.toml.
[[require]]
name = "LogosVerification"
git = "/home/andrew-reynolds/logos-telos-sets"
rev = "2ea5282f7cb1ffe939bcfcdb4aa5a4d358131ebe"
subDir = "verification"

[[require]]
name = "Telos"
path = ".."

[[lean_lib]]
name = "TelosProofs"
roots = []
globs = ["TelosProofs.+"]
moreLeanArgs = ["-DmaxHeartbeats=10000000", "-DwarningAsError=true"]

# Not a default target: it imports Logos's proofs, which are most of the build.
# `lake build TelosFull` proves the unconditional `Telos.rewrite_correct` (see
# `TelosProofs/LogosFacts.lean`).
[[lean_lib]]
name = "TelosFull"
roots = []
globs = ["TelosFull.+"]
moreLeanArgs = ["-DmaxHeartbeats=10000000", "-DwarningAsError=true"]
