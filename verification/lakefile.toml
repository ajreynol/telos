name = "TelosVerification"
version = "0.1.0"
defaultTargets = ["TelosProofs"]
# Mathlib's style linters do not apply to this project (see Logos's
# verification/lakefile.toml, which this mirrors).
weakLeanArgs = [
  "-Dweak.linter.mathlibStandardSet=false",
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.0"

# Logos's verification package: model semantics and checker soundness proofs.
# Same commit as the `Cpc` requirement in ../lakefile.toml.
[[require]]
name = "LogosVerification"
git = "https://github.com/ajreynol/logos"
rev = "b1b49e7e7451a51af4752071022656f86e5a93e8"
subDir = "verification"

[[require]]
name = "Telos"
path = ".."

[[lean_lib]]
name = "TelosProofs"
roots = []
globs = ["TelosProofs.+"]
moreLeanArgs = ["-DmaxHeartbeats=10000000", "-DwarningAsError=true"]
