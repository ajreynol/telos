name = "Telos"
version = "0.1.0"
defaultTargets = ["Telos", "TelosTests", "telos"]

# Logos, the CPC checker. Only its root package `Cpc` is required here, so the
# rewriter builds without Mathlib. Keep `rev` in sync with the
# `LogosVerification` requirement in verification/lakefile.toml.
[[require]]
name = "Cpc"
git = "/home/andrew-reynolds/logos-telos-sets"
rev = "2ea5282f7cb1ffe939bcfcdb4aa5a4d358131ebe"

[[lean_lib]]
name = "Telos"
moreLeanArgs = ["-DwarningAsError=true"]

# Tests, checked at build time (`#guard`).
[[lean_lib]]
name = "TelosTests"
roots = []
globs = ["TelosTests.+"]
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "telos"
root = "Main"

# Random terms and their rewrites, for differential testing (`scripts/fuzz.py`).
[[lean_exe]]
name = "telos-fuzz"
root = "FuzzMain"
